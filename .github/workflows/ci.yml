name: Best Cars CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Django dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run Django checks and tests
        working-directory: server
        run: |
          python manage.py check
          python manage.py test djangoapp --verbosity 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Build React client
        working-directory: server/frontend
        run: |
          npm ci
          CI=false npm run build
