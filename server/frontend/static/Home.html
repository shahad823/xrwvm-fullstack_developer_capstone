<html>
<head><title>Best Cars | Home</title><meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/bootstrap.min.css">
<script>
async function logout(event) {
  if (event) event.preventDefault();
  try {
    const response = await fetch("/djangoapp/logout", {credentials:"same-origin"});
    if (!response.ok) throw new Error("Logout failed. Please try again.");
    sessionStorage.removeItem("username");
    window.location.assign("/");
  } catch (error) {document.getElementById("auth-error").textContent=error.message;}
}
async function checkSession() {
  const panel=document.getElementById("loginlogout");
  try {
    const response=await fetch("/djangoapp/session",{credentials:"same-origin"});
    if (!response.ok) throw new Error("Could not check your session.");
    const data=await response.json();
    panel.replaceChildren();
    if (data.authenticated) {
      sessionStorage.setItem("username",data.userName);
      const name=document.createElement("span"); name.textContent=data.userName; name.className="homepage_links"; panel.appendChild(name);
      const link=document.createElement("a");link.textContent="Logout";link.href="/djangoapp/logout";link.className="homepage_links";link.addEventListener("click",logout);panel.appendChild(link);
    } else {
      sessionStorage.removeItem("username");
      [["Login","/login/"],["Register","/register/"]].forEach(([text,href])=>{const link=document.createElement("a");link.textContent=text;link.href=href;link.className="homepage_links";panel.appendChild(link);});
    }
  } catch(error) {document.getElementById("auth-error").textContent=error.message;}
}
</script>
</head>
<body onload="checkSession()">
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
  <div class="container-fluid">
    <h2 style="padding-right: 5%;">Dealerships</h2>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" style="font-size: larger;" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
        </li>
      </ul>
      <span class="navbar-text">
        <div class="loginlink" id="loginlogout">
        </div>
        </span>
    </div>
  </div>
</nav><p id="auth-error" role="alert"></p>
<div style="display: flex;flex-direction: column;">
<div class="card" style="width: 50%;margin-top: 50px;align-self: center;">
  <img src="static/car_dealership.jpg" class="card-img-top" alt="...">
  <div class="banner">
    <h5>Welcome to our Dealerships!</h5>
    <a href="/dealers" class="btn" style="background-color: aqua;margin:10px">View Dealerships</a>
  </div>
</div>
</div>
</body>
</html>
